name: Healint
description: 'Healint is a Singapore-headquartered digital health company best known for
  Migraine Buddy, the world''s largest migraine and headache tracking and research
  platform, used by more than three million people to log attacks, symptoms, triggers,
  medications, and treatment outcomes. The company applies machine learning, mobile
  sensor technologies, and analytics to help people manage migraine and other neurological
  conditions, and to generate real-world evidence for clinicians, researchers, and
  pharmaceutical partners. Healint and Migraine Buddy are now part of Aptar Digital
  Health, whose regulated companion apps, patient-support software, and drug-delivery
  platforms operate across more than 120 countries on HIPAA-compliant infrastructure.
  Healint does not currently publish a public developer API, SDK, or developer portal;
  this profile tracks its identity and public web surface in the API Evangelist network.'
